<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="bg-gym" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1f1435"/>
      <stop offset="1" stop-color="#0a0817"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a783ff"/>
      <stop offset="1" stop-color="#5c8dff"/>
    </linearGradient>
    <filter id="shadow-gym">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Shell principal -->
  <rect x="64" y="44" width="592" height="420" rx="24" fill="url(#bg-gym)" stroke="#a783ff" stroke-opacity=".35" filter="url(#shadow-gym)"/>

  <!-- Barra superior -->
  <rect x="64" y="44" width="592" height="54" rx="24" fill="#150f28"/>
  <circle cx="98" cy="71" r="6" fill="#a783ff"/>
  <circle cx="118" cy="71" r="6" fill="#5ce1e6"/>
  <circle cx="138" cy="71" r="6" fill="#5c8dff"/>
  <text x="170" y="75" fill="#a783ff" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">GYMFIT LIFE // GESTIÓN INTEGRAL FITNESS &amp; ATLETAS</text>
  <rect x="510" y="60" width="122" height="22" rx="6" fill="#a783ff" opacity=".15"/>
  <text x="571" y="75" text-anchor="middle" fill="#a783ff" font-family="monospace" font-size="9">MEMBRESÍAS ACTIVAS</text>

  <!-- Panel Izquierdo: Ficha Atleta & Rutina -->
  <g transform="translate(90, 116)">
    <rect x="0" y="0" width="230" height="316" rx="14" fill="#100b21" stroke="#a783ff" stroke-opacity=".2"/>
    
    <!-- Header Atleta -->
    <circle cx="40" cy="42" r="22" fill="#241644"/>
    <circle cx="40" cy="36" r="8" fill="#a783ff" opacity=".8"/>
    <path d="M26 54c3-10 25-10 28 0" fill="#a783ff" opacity=".6"/>
    <text x="74" y="38" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Lucas M. · Atleta</text>
    <rect x="74" y="44" width="76" height="16" rx="4" fill="#5ce1e6" opacity=".15"/>
    <text x="112" y="55" text-anchor="middle" fill="#5ce1e6" font-family="monospace" font-size="8">PLAN ANUAL PRO</text>

    <!-- Métricas corporales -->
    <rect x="16" y="80" width="198" height="54" rx="8" fill="#18112f"/>
    <text x="32" y="100" fill="#8ca0b3" font-family="monospace" font-size="8">PESO ACTUAL</text>
    <text x="32" y="122" fill="#f2f7fc" font-family="'DM Mono', monospace" font-size="13" font-weight="600">78.5 kg</text>
    <line x1="94" y1="88" x2="94" y2="126" stroke="#2b1f4c"/>
    <text x="114" y="100" fill="#8ca0b3" font-family="monospace" font-size="8">ASISTENCIA MES</text>
    <text x="114" y="122" fill="#a783ff" font-family="'DM Mono', monospace" font-size="13" font-weight="600">18 sesiones</text>

    <!-- Rutina Asignada -->
    <text x="16" y="156" fill="#a783ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">RUTINA: HIPERTROFIA / DÍA 3</text>
    
    <rect x="16" y="168" width="198" height="38" rx="6" fill="#18112f"/>
    <text x="26" y="184" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Press Banca Plano</text>
    <text x="26" y="196" fill="#8ca0b3" font-family="monospace" font-size="8">4 series × 8-10 reps · 85 kg</text>
    <circle cx="196" cy="187" r="8" fill="#5ce1e6" opacity=".2"/>
    <path d="M193 187l2 2 4-4" stroke="#5ce1e6" stroke-width="2" fill="none"/>

    <rect x="16" y="214" width="198" height="38" rx="6" fill="#18112f"/>
    <text x="26" y="230" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Sentadilla Trasera</text>
    <text x="26" y="242" fill="#8ca0b3" font-family="monospace" font-size="8">4 series × 6-8 reps · 110 kg</text>
    <circle cx="196" cy="233" r="8" fill="#5ce1e6" opacity=".2"/>
    <path d="M193 233l2 2 4-4" stroke="#5ce1e6" stroke-width="2" fill="none"/>

    <rect x="16" y="262" width="198" height="38" rx="6" fill="#18112f"/>
    <text x="26" y="278" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Dominadas Lastradas</text>
    <text x="26" y="290" fill="#8ca0b3" font-family="monospace" font-size="8">3 series × 10 reps · +15 kg</text>
    <circle cx="196" cy="281" r="8" fill="#a783ff" opacity=".2"/>
  </g>

  <!-- Panel Derecho: Reservas, Turnos y Capacidad -->
  <g transform="translate(340, 116)">
    <!-- Reservas y cupos -->
    <rect x="0" y="0" width="290" height="150" rx="14" fill="#100b21" stroke="#a783ff" stroke-opacity=".2"/>
    <text x="20" y="28" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Gestión de Clases &amp; Turnos de Hoy</text>
    <text x="20" y="44" fill="#8ca0b3" font-family="'DM Mono', monospace" font-size="9">Control de cupos y aforo en sala</text>

    <!-- Turno 1 -->
    <rect x="18" y="58" width="254" height="38" rx="8" fill="#18112f"/>
    <text x="30" y="74" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">18:00 — Cross Training</text>
    <text x="30" y="86" fill="#a783ff" font-family="monospace" font-size="8">Coach: Martín S. · Cupo: 20/20 (Completo)</text>
    <rect x="210" y="68" width="52" height="18" rx="4" fill="#f4b85c" opacity=".2"/>
    <text x="236" y="80" text-anchor="middle" fill="#f4b85c" font-family="monospace" font-size="8">LLENO</text>

    <!-- Turno 2 -->
    <rect x="18" y="102" width="254" height="38" rx="8" fill="#18112f"/>
    <text x="30" y="118" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">19:30 — Funcional &amp; Movilidad</text>
    <text x="30" y="130" fill="#5ce1e6" font-family="monospace" font-size="8">Coach: Carla R. · Cupo: 14/20</text>
    <rect x="210" y="112" width="52" height="18" rx="4" fill="#5ce1e6" opacity=".2"/>
    <text x="236" y="124" text-anchor="middle" fill="#5ce1e6" font-family="monospace" font-size="8">DISPONIBLE</text>

    <!-- Panel Métricas Administrativas del Gimnasio -->
    <rect x="0" y="166" width="290" height="150" rx="14" fill="#100b21" stroke="#a783ff" stroke-opacity=".2"/>
    <text x="20" y="194" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Control Administrativo &amp; Retención</text>
    <text x="20" y="210" fill="#8ca0b3" font-family="'DM Mono', monospace" font-size="9">Membresías al día vs. Vencimientos</text>

    <!-- Barra de progreso -->
    <rect x="20" y="228" width="250" height="14" rx="7" fill="#1f1435"/>
    <rect x="20" y="228" width="205" height="14" rx="7" fill="url(#purple-glow)"/>
    <text x="20" y="260" fill="#a783ff" font-family="'DM Mono', monospace" font-size="10">82% Socios Activos</text>
    <text x="270" y="260" text-anchor="end" fill="#8ca0b3" font-family="monospace" font-size="9">348 atletas</text>

    <!-- Botón CTA de administración -->
    <rect x="20" y="276" width="250" height="26" rx="6" fill="#a783ff" opacity=".2" stroke="#a783ff" stroke-opacity=".5"/>
    <text x="145" y="293" text-anchor="middle" fill="#a783ff" font-family="monospace" font-size="9" font-weight="600">NUEVA INSCRIPCIÓN / COBRO</text>
  </g>
</svg>
