<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="bg-life" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141c2b"/>
      <stop offset="1" stop-color="#09101d"/>
    </linearGradient>
    <linearGradient id="violet-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a783ff"/>
      <stop offset="1" stop-color="#5ce1e6"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#5ce1e6"/>
    </linearGradient>
    <filter id="shadow-life">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Shell principal -->
  <rect x="64" y="44" width="592" height="420" rx="24" fill="url(#bg-life)" stroke="#a783ff" stroke-opacity=".35" filter="url(#shadow-life)"/>

  <!-- Barra superior -->
  <rect x="64" y="44" width="592" height="54" rx="24" fill="#0d1524"/>
  <circle cx="98" cy="71" r="6" fill="#a783ff"/>
  <circle cx="118" cy="71" r="6" fill="#5ce1e6"/>
  <circle cx="138" cy="71" r="6" fill="#3ddc97"/>
  <text x="170" y="75" fill="#a783ff" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">LIFE FLOW // BIENESTAR INTEGRAL &amp; HÁBITOS</text>
  <rect x="500" y="60" width="132" height="22" rx="6" fill="#a783ff" opacity=".15"/>
  <text x="566" y="75" text-anchor="middle" fill="#a783ff" font-family="monospace" font-size="9">PERSISTENCIA MODULAR</text>

  <!-- Panel Izquierdo: Métricas de Hábitos & Score -->
  <g transform="translate(90, 116)">
    <rect x="0" y="0" width="240" height="316" rx="14" fill="#0c1322" stroke="#a783ff" stroke-opacity=".2"/>

    <!-- Score Diario -->
    <rect x="18" y="18" width="204" height="74" rx="10" fill="#131d31"/>
    <text x="32" y="38" fill="#8ca0b3" font-family="'Segoe UI', sans-serif" font-size="10">WELLNESS SCORE DIARIO</text>
    <text x="32" y="68" fill="#5ce1e6" font-family="'DM Mono', monospace" font-size="24" font-weight="700">94.8%</text>
    <text x="32" y="82" fill="#3ddc97" font-family="monospace" font-size="8">↑ Óptimo · 7 días consecutivos</text>

    <!-- Hábitos Activos -->
    <text x="18" y="112" fill="#a783ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">SEGUIMIENTO DE HÁBITOS</text>

    <!-- Hábito 1: Hidratación -->
    <rect x="18" y="122" width="204" height="42" rx="6" fill="#131d31"/>
    <circle cx="34" cy="143" r="8" fill="#5ce1e6" opacity=".2"/>
    <text x="48" y="139" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Hidratación (2.5L)</text>
    <text x="48" y="153" fill="#8ca0b3" font-family="monospace" font-size="8">2.2L / 2.5L completado</text>
    <rect x="174" y="132" width="36" height="20" rx="4" fill="#5ce1e6" opacity=".2"/>
    <text x="192" y="145" text-anchor="middle" fill="#5ce1e6" font-family="monospace" font-size="8">88%</text>

    <!-- Hábito 2: Meditación / Mindfulness -->
    <rect x="18" y="172" width="204" height="42" rx="6" fill="#131d31"/>
    <circle cx="34" cy="193" r="8" fill="#a783ff" opacity=".2"/>
    <text x="48" y="189" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Mindfulness &amp; Respiración</text>
    <text x="48" y="203" fill="#8ca0b3" font-family="monospace" font-size="8">15 min completados</text>
    <rect x="174" y="182" width="36" height="20" rx="4" fill="#3ddc97" opacity=".2"/>
    <text x="192" y="195" text-anchor="middle" fill="#3ddc97" font-family="monospace" font-size="8">100%</text>

    <!-- Hábito 3: Actividad Física -->
    <rect x="18" y="222" width="204" height="42" rx="6" fill="#131d31"/>
    <circle cx="34" cy="243" r="8" fill="#5c8dff" opacity=".2"/>
    <text x="48" y="239" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Caminata / Movilidad</text>
    <text x="48" y="253" fill="#8ca0b3" font-family="monospace" font-size="8">8.420 / 10.000 pasos</text>
    <rect x="174" y="232" width="36" height="20" rx="4" fill="#5c8dff" opacity=".2"/>
    <text x="192" y="245" text-anchor="middle" fill="#5c8dff" font-family="monospace" font-size="8">84%</text>

    <!-- Hábito 4: Calidad de Sueño -->
    <rect x="18" y="272" width="204" height="34" rx="6" fill="#131d31"/>
    <text x="32" y="293" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="10">Sueño Reparador: 7h 45m</text>
    <circle cx="198" cy="289" r="6" fill="#3ddc97"/>
  </g>

  <!-- Panel Derecho: Arquitectura Modular & Tendencias -->
  <g transform="translate(350, 116)">
    <!-- Evolución de Hábitos Semanales -->
    <rect x="0" y="0" width="280" height="150" rx="14" fill="#0c1322" stroke="#a783ff" stroke-opacity=".2"/>
    <text x="20" y="28" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Consistencia Semanal</text>
    <text x="20" y="44" fill="#8ca0b3" font-family="'DM Mono', monospace" font-size="9">Registro histórico de cumplimiento</text>

    <!-- Gráfico de tendencia -->
    <path d="M24 116 Q 64 68 104 90 T 174 72 T 244 54" fill="none" stroke="url(#violet-cyan)" stroke-width="3"/>
    <circle cx="244" cy="54" r="5" fill="#5ce1e6"/>

    <g fill="#8ca0b3" font-family="monospace" font-size="8">
      <text x="24" y="136">LUN</text><text x="60" y="136">MAR</text><text x="96" y="136">MIÉ</text>
      <text x="132" y="136">JUE</text><text x="168" y="136">VIE</text><text x="204" y="136">SÁB</text><text x="240" y="136">DOM</text>
    </g>

    <!-- Panel de Arquitectura Modular y Persistencia -->
    <rect x="0" y="166" width="280" height="150" rx="14" fill="#0c1322" stroke="#a783ff" stroke-opacity=".2"/>
    <text x="20" y="192" fill="#f2f7fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Arquitectura Modular &amp; Persistencia</text>
    <text x="20" y="208" fill="#8ca0b3" font-family="'DM Mono', monospace" font-size="9">Estructura de datos desacoplada</text>

    <!-- Bloques de capas -->
    <rect x="20" y="224" width="74" height="38" rx="6" fill="#131d31" stroke="#a783ff" stroke-opacity=".4"/>
    <text x="57" y="240" text-anchor="middle" fill="#a783ff" font-family="monospace" font-size="8" font-weight="600">STATE</text>
    <text x="57" y="252" text-anchor="middle" fill="#8ca0b3" font-family="monospace" font-size="7">Modular</text>

    <text x="102" y="246" fill="#5ce1e6" font-family="monospace" font-size="12">→</text>

    <rect x="114" y="224" width="74" height="38" rx="6" fill="#131d31" stroke="#5ce1e6" stroke-opacity=".4"/>
    <text x="151" y="240" text-anchor="middle" fill="#5ce1e6" font-family="monospace" font-size="8" font-weight="600">STORAGE</text>
    <text x="151" y="252" text-anchor="middle" fill="#8ca0b3" font-family="monospace" font-size="7">Estructurado</text>

    <text x="196" y="246" fill="#3ddc97" font-family="monospace" font-size="12">→</text>

    <rect x="208" y="224" width="52" height="38" rx="6" fill="#131d31" stroke="#3ddc97" stroke-opacity=".4"/>
    <text x="234" y="240" text-anchor="middle" fill="#3ddc97" font-family="monospace" font-size="8" font-weight="600">UI</text>
    <text x="234" y="252" text-anchor="middle" fill="#8ca0b3" font-family="monospace" font-size="7">UX/UI</text>

    <!-- Indicador de estado -->
    <rect x="20" y="278" width="240" height="24" rx="6" fill="#a783ff" opacity=".12"/>
    <circle cx="34" cy="290" r="4" fill="#3ddc97"/>
    <text x="46" y="293" fill="#f2f7fc" font-family="monospace" font-size="8">SINCRONIZACIÓN LOCAL Y REMOTA OK</text>
  </g>
</svg>
